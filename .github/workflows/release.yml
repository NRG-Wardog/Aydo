name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v4.0.0). Leave blank to build the artifact without publishing a GitHub Release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  desktop-package:
    name: Package desktop application
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Client/GUI
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run package -- --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: aydo-desktop-windows
          path: Client/GUI/release/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - desktop-package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Validate release tag
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must be non-empty and start with 'v'." >&2
            exit 1
          fi
      - name: Create release archives
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/aydo-desktop-${RELEASE_TAG}.tar.gz" -C artifacts .
      - name: Publish release from pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
      - name: Publish release from manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --target "$TARGET_SHA"
