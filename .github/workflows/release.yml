name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-package:
    name: Package desktop application
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Client/GUI
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run package -- --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: aydo-desktop-windows
          path: Client/GUI/release/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - desktop-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release archives
        run: |
          mkdir -p dist
          tar -czf "dist/aydo-desktop-${GITHUB_REF_NAME}.tar.gz" -C artifacts .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
