name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - production
      - v4.0.0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python update-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests/python -v
      - name: Compile Python sources
        run: python -m compileall -q scripts tests/python

  desktop-tests:
    name: Desktop typecheck, build, and E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/GUI
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Run desktop CI tests
        run: xvfb-run --auto-servernum bun run test:ci
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-diagnostics
          path: |
            Client/GUI/playwright-report
            Client/GUI/test-results
          if-no-files-found: ignore

  native-tests:
    name: Native Windows build and self-tests
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Install native dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $assetScript = Join-Path $env:GITHUB_WORKSPACE "scripts\ci\fetch-vcpkg-asset.ps1"
          $env:X_VCPKG_ASSET_SOURCES = "clear;x-script,pwsh -NoProfile -File `"$assetScript`" `"{url}`" `"{sha512}`" `"{dst}`""
          $env:VCPKG_KEEP_ENV_VARS = "GITHUB_TOKEN"

          $maximumAttempts = 3
          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
              --triplet x64-windows-static `
              --x-manifest-root "$env:GITHUB_WORKSPACE"

            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -lt $maximumAttempts) {
              Write-Warning "vcpkg install attempt $attempt failed; retrying in 30 seconds."
              Start-Sleep -Seconds 30
            } else {
              throw "vcpkg install failed after $maximumAttempts attempts."
            }
          }

          # The hosted runner ships vcpkg, but direct .vcxproj builds do not
          # automatically import its MSBuild integration. Register the current
          # runner's vcpkg instance so the already-installed manifest packages
          # contribute their include/library paths to every native project.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg MSBuild integration failed."
          }

      - name: Build user-mode projects
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT\"
          $vcpkgInstalledDir = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\"
          $projects = @(
            "server\VM\ProcessRunnerDLL\ProcessRunnerDLL.vcxproj",
            "server\VM\ProcessRunner\ProcessRunner.vcxproj",
            "server\VM\VMRunner\VMRunner.vcxproj",
            "server\VM\ProcessMonitor\ProcessMonitor.vcxproj",
            "server\Server\Server.vcxproj"
          )
          foreach ($project in $projects) {
            # Dependencies were installed explicitly in the previous step.
            # Disable MSBuild's manifest bootstrap here so it does not invoke a
            # second vcpkg install with an empty triplet on hosted runners.
            msbuild $project /nologo /m /restore /t:Build `
              /p:Configuration=Release /p:Platform=x64 `
              /p:VcpkgEnableManifest=false `
              /p:VcpkgRoot="$vcpkgRoot" `
              /p:VcpkgInstalledDir="$vcpkgInstalledDir" `
              /p:VcpkgTriplet=x64-windows-static
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run deterministic native self-tests
        shell: pwsh
        run: ./scripts/ci/run_native_tests.ps1 -Configuration Release -SkipEndpointService

      - name: Validate endpoint service project coverage
        shell: pwsh
        run: |
          [xml]$project = Get-Content Client/Service/Service.vcxproj
          $sources = @($project.Project.ItemGroup.ClCompile.Include)
          $required = @("Main.cpp", "ProcessMonitor.cpp", "Yara\YScanningEngine.cpp")
          foreach ($source in $required) {
            if ($sources -notcontains $source) {
              throw "Endpoint service project is missing expected source: $source"
            }
          }

      - name: Validate kernel driver project
        shell: pwsh
        run: |
          [xml]$project = Get-Content Client/KernelDriver/KernelDriver.vcxproj
          if ($project.Project.ItemGroup.ClCompile.Count -eq 0) {
            throw "Kernel driver project has no compile inputs"
          }
          if ($project.Project.PropertyGroup.PlatformToolset -notcontains "WindowsKernelModeDriver10.0") {
            throw "Kernel driver project is not configured for the WDK"
          }

      - name: Validate WiX authoring
        shell: pwsh
        run: |
          # Hosted CI validates the installer authoring without pretending to
          # produce a deployable endpoint package. WDK-built endpoint binaries,
          # the packaged Electron app, and generated security data are supplied
          # only by the controlled release environment.
          New-Item -ItemType Directory -Force x64/Release | Out-Null
          New-Item -ItemType Directory -Force Client/GUI/release/win-unpacked | Out-Null
          New-Item -ItemType Directory -Force data | Out-Null
          Set-Content -NoNewline x64/Release/KernelDriver.sys "ci-authoring-fixture"
          Set-Content -NoNewline x64/Release/Service.exe "ci-authoring-fixture"
          Set-Content -NoNewline x64/Release/runtime.dll "ci-authoring-fixture"
          Set-Content -NoNewline "Client/GUI/release/win-unpacked/Aydo Security.exe" "ci-authoring-fixture"
          Set-Content -NoNewline data/aaa.7z "ci-authoring-fixture"
          Set-Content -NoNewline data/file_hashes.db "ci-authoring-fixture"
          msbuild Installer/Installer.wixproj /nologo /restore /t:Compile /p:Configuration=Release /p:Platform=x64

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: aydo-native-release
          path: |
            x64/Release/**
            server/Server/x64/Release/**
            server/VM/VMRunner/x64/Release/**
            server/VM/ProcessMonitor/bin/x64/Release/**
          if-no-files-found: error

  ci-success:
    name: CI required checks
    if: always()
    needs:
      - python-tests
      - desktop-tests
      - native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all test suites
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          print(results)
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          PY
